
# TixXinBlog 0.5.3 — Render Free Blueprint
services:
  - type: web
    name: tixxinblog-web
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./src/frontend/web-blog/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUXT_PUBLIC_USE_MOCK_REPO
        value: "false"
      - key: NUXT_PUBLIC_POST_USE_MOCK_REPO
        value: "false"
      - key: NUXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: NUXT_PUBLIC_DEFAULT_LOCALE
        value: en
      - key: NUXT_RELEASE_VERSION
        value: "0.5.3"
      - key: NUXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: tixxinblog-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_ORIGIN
        fromService:
          type: web
          name: tixxinblog-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: tixxinblog-api
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile.api
    dockerContext: .
    dockerCommand: sh -c 'corepack pnpm migration:up && exec node dist/main.js'
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MEDIA_DIRECTORY
        value: /tmp/tixxin-media
      - key: DATABASE_URL
        fromDatabase:
          name: tixxinblog-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: tixxinblog-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SITE_DEFAULT_LOCALE
        value: en

databases:
  - name: tixxinblog-db
    databaseName: tixxinblog
    user: tixxinblog
    plan: free
    region: singapore
    
